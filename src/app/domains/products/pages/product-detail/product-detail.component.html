@let productData = product();

@if(productData){
<div class="w-full flex flex-col md:flex-row md:space-x-10">
  <div class="flex flex-col w-full md:w-1/3">
    <div class="w-full rounded border border-gray-200">
      <div class="relative h-96">
        <img
          alt="ecommerce"
          class="w-full object-cover object-center"
          [ngSrc]="cover()!"          
          [fill]="true"
          [priority]="true"
        />
      </div>
    </div>
    <div class="flex items-center justify-center mt-1">
      <div class="grid grid-cols-3 gap-1">
        @for (img of productData?.images; track img) {
        <img alt="ecommerce" role="button" tabindex="0" [src]="img" (click)="cover.set(img)"
          (keydown.enter)="cover.set(img)" [class.border-red-400]="img === cover()"
          class="object-cover object-center rounded border-2 border-gray-200" />
        }
      </div>
    </div>
  </div>
  <div class="mt-5 w-full">
    <h2 class="text-sm title-font text-gray-500 tracking-widest">
      {{ productData?.category?.name | uppercase }}
    </h2>
    <h1 class="text-gray-900 text-3xl title-font font-medium mb-1">
      {{ productData?.title }}
    </h1>
    <p class="leading-relaxed">
      {{ productData?.description }}
    </p>
    <p class="title-font font-medium text-2xl text-gray-900 mt-5">
      {{ productData?.price | currency: "$" : "symbol" : "1.0" }}
    </p>
    <button (click)="addToCart()"
      class="flex text-white bg-red-500 border-0 py-2 px-6 focus:outline-none hover:bg-red-600 rounded">
      Add To Cart
    </button>
  </div>
</div>

}
